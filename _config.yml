# ==============================================
# 🔴 第一部分：网站基本设置（这部分必须全部修改！）
# ==============================================
locale                   : "zh-CN" # 网站语言，中文用zh-CN，英文用en-US
title                    : "黎畅 | 上海大学数学系" # 浏览器标签页显示的标题
title_separator          : "-"
name                     : &name "黎畅 Chang Li" # 例如：张三 San Zhang
description              : &description "上海大学数学系硕士研究生，研究方向：多线性调和分析与偏微分方程" # 搜索引擎显示的描述
url                      : "https://Chang-Li-0312.github.io" # ⚠️必须修改！你的完整网站地址
baseurl                  : "" # ⚠️必须留空！绝对不要填任何东西
repository               : "Chang-Li-0312/Chang-Li-0312.github.io" # ⚠️必须修改！你的仓库地址

# 网站缩略图（分享到微信/推特时显示的图片，可选）
#teaser                   : "/images/banner.jpg"
breadcrumbs              : false # 是否显示面包屑导航，学术主页建议关闭
words_per_minute         : 200

# ==============================================
# 🟡 第二部分：作者个人信息（这部分修改成你自己的）
# ==============================================
author:
  name             : "Chang Li" # 例如：张三 San Zhang
  avatar           : "/images/profile.jpg" # 头像路径，上传到images文件夹
  bio              : "上海大学数学系硕士研究生<br>导师：赵发友 教授" # 侧边栏显示的简介，支持HTML换行
  location         : "上海, 中国"
  employer         : "上海大学"
  email            : "changli@shu.edu.cn" # 你的学校邮箱

  # 学术社交账号（不需要的可以删掉整行）
  #googlescholar    : "你的Google Scholar ID" # 只需要ID部分，不是完整链接
  #orcid            : "0000-0000-0000-0000" # 你的ORCID号
  #researchgate     : "你的ResearchGate用户名"
  arxiv            : "https://arxiv.org/a/ChangLi" # arXiv个人主页
  #github           : "你的GitHub用户名"
  # twitter         : "你的Twitter用户名"
  # linkedin        : "你的LinkedIn用户名"
  # weibo           : "你的微博用户名"

# ==============================================
# 🟢 第三部分：网站功能设置（一般不需要修改）
# ==============================================
# 数学公式支持（默认已开启，完美支持LaTeX）
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  math_engine: mathjax # 启用MathJax渲染数学公式

# 论文列表设置
collections:
  publications:
    output: true
    permalink: /:collection/:title/
  talks:
    output: true
    permalink: /:collection/:title/
  teaching:
    output: true
    permalink: /:collection/:title/
  portfolio:
    output: true
    permalink: /:collection/:title/
  posts:
    output: true
    permalink: /posts/:year/:month/:day/:title/

# 论文排序方式（按年份倒序，最新的在最上面）
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
      related: true
      sort_by: "year"
      sort_order: "descending"

  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: true

# ==============================================
# 🟣 第四部分：导航栏设置（建议保持这样）
# ==============================================
# 顶部导航栏显示的链接，不需要的可以删掉
navigation:
  - title: "关于我"
    url: /
  - title: "研究成果"
    url: /publications/
  - title: "教学经历"
    url: /teaching/
  - title: "学术报告"
    url: /talks/
  - title: "个人简历"
    url: /cv/

# ==============================================
# ⚫ 第五部分：高级配置（完全不需要修改）
# ==============================================
remote_theme: "academicpages/academicpages.github.io"
search: false # 是否开启搜索功能
search_full_content: false
search_provider: lunr

# 网站构建设置
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# 插件（GitHub Pages官方支持的插件）
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache

# 分页设置
paginate: 10
paginate_path: /posts/page:num/
